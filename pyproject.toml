[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmsoc"
version = "1.0.0"
description = "SOC estimation for Li-ion cells: EKF / UKF / AEKF on a temperature-aware 2-RC model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["battery", "BMS", "state-of-charge", "SOC", "EKF", "UKF", "Kalman-filter", "equivalent-circuit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
